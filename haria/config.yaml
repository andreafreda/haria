name: "HARIA"
description: "Home Assistant Reactive Intelligent Agent — AI assistant via Telegram and HA chat"
version: "0.1.52"
slug: "haria"
url: "https://github.com/andreafreda/haria"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:robot
panel_title: HARIA
map:
  - data
  - config:rw
services:
  - mqtt:want
options:
  anthropic_key: ""
  telegram_token: ""
  groq_key: ""
  fdc_key: ""
  ha_url: "http://homeassistant.local:8123"
  ha_token: ""
  log_level: "info"
  modules:
    telegram: true
    ha_chat: false
    voice: true
    agenda: true
    food_diary: true
    web_search: true
    multi_user: true
    bollette: true
  users: []

schema:
  anthropic_key: str
  telegram_token: str
  groq_key: str?
  fdc_key: str?
  ha_url: str
  ha_token: str
  log_level: list(debug|info|warning|error)?
  modules:
    telegram: bool
    ha_chat: bool
    voice: bool
    agenda: bool
    food_diary: bool
    web_search: bool
    multi_user: bool
    bollette: bool
  users:
    - name: str
      chat_id: str
      context: str?
      notify_service: str?
